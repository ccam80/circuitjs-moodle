<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bridge Test Page</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    #readout {
      font-family: monospace; background: #f4f4f4; padding: 12px;
      margin-top: 10px; white-space: pre-wrap; min-height: 80px;
      border: 1px solid #ccc; font-size: 13px;
    }
    iframe { border: 1px solid #999; display: block; }
    h3 { margin-top: 0; }
    .note { color: #666; font-size: 13px; margin-bottom: 10px; }
  </style>
</head>
<body>

<h3>CircuitJS1 Bridge Test</h3>
<p class="note">
  Uses the bundled "jsinterface" demo circuit (has labeled nodes: vsense, D0-D7).
  If live voltage values appear below, the bridge is working correctly.
</p>

<!--
  startCircuit=jsinterface.txt  — load the bundled JS interface demo circuit
  nodes=vsense                  — read the "vsense" labeled node
  rate=4                        — post data ~4 times/sec
  Controls are visible (defaults: hideSidebar=false, hideMenu=false)
-->
<iframe id="bridge-frame"
  src="bridge.html?startCircuit=jsinterface.txt&nodes=vsense&rate=4&editable=true"
  width="800" height="550">
</iframe>

<div id="readout">Waiting for data...</div>

<script>
var readout = document.getElementById('readout');
var messageCount = 0;

window.addEventListener('message', function(event) {
  if (!event.data) return;

  if (event.data.type === 'circuitjs-data') {
    messageCount++;
    var lines = ['=== circuitjs-data (message #' + messageCount + ') ==='];
    for (var key in event.data.values) {
      var val = event.data.values[key];
      lines.push('  ' + key + ' = ' + (val !== null ? val.toFixed(6) : 'null') + ' V');
    }
    readout.textContent = lines.join('\n');
  }

  if (event.data.type === 'circuitjs-elements') {
    var lines = ['=== circuitjs-elements (circuit loaded) ==='];
    event.data.elements.forEach(function(e) {
      lines.push('  [' + e.index + '] ' + e.type + (e.label ? '  label="' + e.label + '"' : ''));
    });
    readout.textContent = lines.join('\n') + '\n\n' + readout.textContent;
  }
});
</script>

</body>
</html>
