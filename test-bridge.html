<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bridge Test Page</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    #readout { font-family: monospace; background: #f4f4f4; padding: 12px; margin-top: 10px; white-space: pre-wrap; min-height: 60px; border: 1px solid #ccc; }
    iframe { border: 1px solid #999; }
    h3 { margin-top: 0; }
  </style>
</head>
<body>

<h3>CircuitJS1 Bridge Test</h3>
<p>This page embeds bridge.html and displays the postMessage data it sends.
If you see voltage values updating below, the bridge is working.</p>

<!-- Simple voltage divider circuit with labeled output node "vout" -->
<iframe id="bridge-frame"
  src="bridge.html?ctz=CQAgjCAMB0l3BWcMBMcUHYMGZIA4UA2ATmIxAUgoqoQFMBaMMAKADcQUUAWKvbqHirceYAAoATgEsAdgBcAzqLZUAJjMGi6y1RzGqI4bHgj6Qo1AGDhJMQCMZ12TJCUAHjMIB3e84BmMPbuAPIQCGau4AhB4W5unt6+-szCsZAAZi4AhgA2ABYZGRkA7mmFmToARn65AIYlmSZ5+YUAthl1zQDmJQVtAK5dGX1tjUA&nodes=vout&rate=4&editable=true"
  width="800" height="550">
</iframe>

<div id="readout">Waiting for data...</div>

<script>
var readout = document.getElementById('readout');
var lastData = null;

window.addEventListener('message', function(event) {
  if (!event.data) return;

  if (event.data.type === 'circuitjs-data') {
    lastData = event.data;
    var lines = ['=== circuitjs-data (live) ==='];
    for (var key in event.data.values) {
      var val = event.data.values[key];
      lines.push('  ' + key + ' = ' + (val !== null ? val.toFixed(6) : 'null'));
    }
    readout.textContent = lines.join('\n');
  }

  if (event.data.type === 'circuitjs-elements') {
    var lines = ['=== circuitjs-elements (on circuit load) ==='];
    event.data.elements.forEach(function(e) {
      lines.push('  [' + e.index + '] ' + e.type + (e.label ? ' "' + e.label + '"' : ''));
    });
    readout.textContent = lines.join('\n') + '\n\n' + readout.textContent;
  }
});
</script>

</body>
</html>
