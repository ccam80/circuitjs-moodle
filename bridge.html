<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CircuitJS1 Bridge</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    #sim-frame { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

<iframe id="sim-frame"></iframe>

<script>
(function() {
  // -- Parse URL parameters ------------------------------------------------
  // IMPORTANT: Do NOT use URLSearchParams — it converts '+' to space per
  // the application/x-www-form-urlencoded spec.  Falstad's ctz values use
  // lz-string's URI-component alphabet which includes '+' as data.
  // We parse the raw query string with decodeURIComponent (which preserves '+').
  function getParam(name) {
    var match = window.location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
    return match ? decodeURIComponent(match[1]) : '';
  }

  var ctz          = getParam('ctz');
  var cct          = getParam('cct');
  var startCircuit = getParam('startCircuit');
  var nodes        = getParam('nodes').split(',').filter(Boolean);
  var elements     = getParam('elements').split(',').filter(Boolean);
  var measures     = getParam('measures').split(',').filter(Boolean);
  var rate         = parseInt(getParam('rate') || '4', 10);

  // Integrity checking: which element indices students may edit
  var editableIndices = new Set(
    getParam('editableIndices').split(',').filter(Boolean).map(Number));
  var baselineSignatures = null;  // null until first onanalyze
  var integrityOk = 1;

  // Display options — all default to showing controls
  var editable      = getParam('editable')        || 'true';
  var white         = getParam('whiteBackground') || 'false';
  var hideSidebar   = getParam('hideSidebar')     || 'false';
  var hideMenu      = getParam('hideMenu')        || 'false';

  // -- Build simulator URL -------------------------------------------------
  var simUrl = 'circuitjs.html?running=true'
    + '&whiteBackground=' + white
    + '&editable=' + editable
    + '&hideSidebar=' + hideSidebar
    + '&hideMenu=' + hideMenu;
  // ctz is lz-string compressToEncodedURIComponent output — its alphabet
  // (A-Za-z0-9+-$) is already URL-safe.  Do NOT encodeURIComponent it:
  // that converts '+' to '%2B', which GWT reads as literal '%2B' not '+'.
  if (ctz)          simUrl += '&ctz=' + ctz;
  if (cct)          simUrl += '&cct=' + encodeURIComponent(cct);
  if (startCircuit) simUrl += '&startCircuit=' + encodeURIComponent(startCircuit);

  var frame = document.getElementById('sim-frame');

  // -- Robust connection to CircuitJS1 -------------------------------------
  // The oncircuitjsloaded callback can be lost if set before the iframe
  // navigates. We poll + re-set the callback to handle all timing cases.
  var sim = null;
  var connected = false;
  var updateCount = 0;
  var skipEvery = Math.max(1, Math.round(60 / rate));
  var labelMap = {};  // label -> element, rebuilt on each circuit analysis

  // -- Integrity checking helpers -------------------------------------------
  // Non-element line prefixes in Falstad export format
  var NON_ELEMENT_PREFIXES = ['$', 'w', 'o', '38', 'h', '&'];

  function extractSignatures(exportText, elements) {
    // Split export text into lines, filter to element lines only
    var lines = exportText.split('\n').filter(function(line) {
      line = line.trim();
      if (!line) return false;
      for (var p = 0; p < NON_ELEMENT_PREFIXES.length; p++) {
        var pfx = NON_ELEMENT_PREFIXES[p];
        if (line === pfx || line.indexOf(pfx + ' ') === 0) return false;
      }
      return true;
    });

    // Safety check: element lines must match element count
    if (lines.length !== elements.length) return null;

    var sigs = [];
    for (var i = 0; i < lines.length; i++) {
      var fields = lines[i].split(' ');
      var typeCode = fields[0];
      // Post count determines where coordinate fields end
      var postCount;
      try { postCount = elements[i].getPostCount(); } catch(e) { postCount = 2; }
      // Element line format: type x1 y1 x2 y2 flags param1 param2 ...
      // For N-post elements: type (x y)*N flags params...
      var firstParamIndex = 2 * postCount + 2;  // +1 for type, +1 for flags
      // Signature = type code + parameter fields (excludes coords and flags)
      var paramFields = fields.slice(firstParamIndex);
      sigs.push(typeCode + ' ' + paramFields.join(' '));
    }
    return sigs;
  }

  function initSim(circuitJS1) {
    if (connected) return;  // only init once
    connected = true;
    sim = circuitJS1;

    sim.onupdate = function() {
      try {
        updateCount++;
        if (updateCount % skipEvery !== 0) return;

        var data = { type: 'circuitjs-data', values: {} };

        // Read labeled node voltages
        for (var i = 0; i < nodes.length; i++) {
          try {
            data.values[nodes[i]] = sim.getNodeVoltage(nodes[i]);
          } catch(e) {
            data.values[nodes[i]] = null;
          }
        }

        // Read element properties by index (e.g. "3:current", "5:voltageDiff")
        if (elements.length > 0) {
          var allElems = sim.getElements();
          for (var j = 0; j < elements.length; j++) {
            var parts = elements[j].split(':');
            var idx   = parseInt(parts[0], 10);
            var prop  = parts[1] || 'current';
            if (idx < allElems.length) {
              try {
                if (prop === 'current')     data.values[elements[j]] = allElems[idx].getCurrent();
                if (prop === 'voltageDiff') data.values[elements[j]] = allElems[idx].getVoltageDiff();
                if (prop === 'voltage')     data.values[elements[j]] = allElems[idx].getVoltageDiff();
                if (prop === 'power')       data.values[elements[j]] = allElems[idx].getVoltageDiff() * allElems[idx].getCurrent();
              } catch(e) {
                data.values[elements[j]] = null;
              }
            }
          }
        }

        // Read labeled element properties (e.g. "R1:current", "R1:power")
        for (var m = 0; m < measures.length; m++) {
          var mparts = measures[m].split(':');
          var mlabel = mparts[0];
          var mprop  = mparts[1] || 'current';
          var melem  = labelMap[mlabel];
          if (melem) {
            try {
              if (mprop === 'current')          data.values[measures[m]] = melem.getCurrent();
              else if (mprop === 'voltageDiff') data.values[measures[m]] = melem.getVoltageDiff();
              else if (mprop === 'voltage0')    data.values[measures[m]] = melem.getVoltage(0);
              else if (mprop === 'voltage1')    data.values[measures[m]] = melem.getVoltage(1);
              else if (mprop === 'power')       data.values[measures[m]] = melem.getVoltageDiff() * melem.getCurrent();
            } catch(e) {
              data.values[measures[m]] = null;
            }
          } else {
            data.values[measures[m]] = null;
          }
        }

        // Include integrity status if integrity checking is active
        if (editableIndices.size > 0) {
          data.values['integrity'] = integrityOk;
        }

        window.parent.postMessage(data, '*');
      } catch(e) {
        // Swallow — never let exceptions propagate into GWT's simulation loop
      }
    };

    sim.onanalyze = function() {
      try {
        var elems = sim.getElements();
        var info = [];
        labelMap = {};  // rebuild on every re-analysis (circuit may have changed)
        for (var k = 0; k < elems.length; k++) {
          var e = elems[k];
          var lbl = '';
          try { lbl = e.getLabelName() || ''; } catch(x) {}
          info.push({ index: k, type: e.getType(), label: lbl });
          if (lbl) labelMap[lbl] = e;
        }
        window.parent.postMessage({ type: 'circuitjs-elements', elements: info }, '*');

        // Integrity checking: detect unauthorized component modifications
        if (editableIndices.size > 0) {
          var exported = sim.exportCircuit();
          var sigs = extractSignatures(exported, elems);
          if (sigs) {
            if (!baselineSignatures) {
              baselineSignatures = sigs;  // First load — capture baseline
            } else {
              // Compare non-editable elements
              integrityOk = 1;
              for (var ci = 0; ci < baselineSignatures.length; ci++) {
                if (editableIndices.has(ci)) continue;
                if (ci >= sigs.length || sigs[ci] !== baselineSignatures[ci]) {
                  integrityOk = 0;
                  break;
                }
              }
              if (sigs.length !== baselineSignatures.length) integrityOk = 0;
            }
          }
        }
      } catch(e) {
        // Swallow — circuit may be in transient state during re-analysis
      }
    };
  }

  function tryConnect() {
    if (connected) return;
    try {
      var win = frame.contentWindow;
      if (!win) { setTimeout(tryConnect, 300); return; }

      // If GWT already finished loading, connect immediately
      if (win.CircuitJS1) {
        initSim(win.CircuitJS1);
        return;
      }

      // Otherwise set/reset the callback (it may have been lost during nav)
      win.oncircuitjsloaded = function() {
        initSim(win.CircuitJS1);
      };
    } catch(e) {
      // contentWindow not ready yet — retry
    }

    // Keep polling until connected (handles all timing edge cases)
    setTimeout(tryConnect, 300);
  }

  // Debug: log to console so we can verify the URL is correct
  console.log('[bridge] ctz extracted:', ctz ? ctz.length + ' chars, has +: ' + ctz.includes('+') : 'EMPTY');
  console.log('[bridge] simUrl:', simUrl);

  // Start loading the simulator
  frame.src = simUrl;

  // Begin polling for the CircuitJS1 object after a short delay
  setTimeout(tryConnect, 500);
})();
</script>
</body>
</html>
